name: weekly-seo
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Google client
        run: pip install google-auth requests
      - name: Audit, metrics, dashboards for all projects
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python seolocal.py weekly-all --speed 1
      - name: Encrypt and publish dashboards
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          DASH_PASSWORD_FATBUS: ${{ secrets.DASH_PASSWORD_FATBUS }}
          DASH_PASSWORD_STEADYCONTROL: ${{ secrets.DASH_PASSWORD_STEADYCONTROL }}
          DASH_PASSWORD_ZAPASNOY: ${{ secrets.DASH_PASSWORD_ZAPASNOY }}
          DASH_PASSWORD_PSHONKINA: ${{ secrets.DASH_PASSWORD_PSHONKINA }}
        run: python publish.py
      - name: Save history
        run: |
          git config user.name "seolocal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history data/metrics
          git commit -m "weekly snapshot" || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
